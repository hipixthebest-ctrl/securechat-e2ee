<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureChat</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            height: 100vh;
            display: flex;
        }

        /* АВТОРИЗАЦИЯ */
        #authScreen {
            position: fixed;
            inset: 0;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .auth-box {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
        }
        
        .auth-box h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }
        
        .auth-box input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background: #252525;
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
            font-size: 16px;
        }
        
        .auth-box button {
            width: 100%;
            padding: 14px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
        }
        
        .auth-box button.secondary {
            background: #333;
        }
        
        .error-msg {
            color: #ff4444;
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }

        /* ОСНОВНОЙ ИНТЕРФЕЙС */
        #mainApp {
            display: none;
            width: 100%;
            height: 100vh;
        }
        
        /* Боковая панель */
        #sidebar {
            width: 350px;
            min-width: 350px;
            background: #1a1a1a;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .search-box {
            padding: 15px 20px;
        }
        
        .search-box input {
            width: 100%;
            padding: 12px;
            background: #252525;
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
        }
        
        #chatsList {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        .chat-item {
            padding: 12px;
            background: #252525;
            border-radius: 10px;
            margin-bottom: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .chat-item:hover {
            background: #333;
        }
        
        .chat-item-name {
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .chat-item-last {
            font-size: 13px;
            color: #999;
        }

        /* Область чата */
        #chatArea {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        #chatHeader {
            padding: 20px;
            border-bottom: 1px solid #333;
            font-weight: 600;
            font-size: 18px;
        }
        
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
        }
        
        .message.sent {
            justify-content: flex-end;
        }
        
        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 15px;
            background: #252525;
        }
        
        .message.sent .message-bubble {
            background: #007aff;
        }
        
        .message-name {
            font-size: 12px;
            color: #999;
            margin-bottom: 5px;
        }
        
        .message img {
            max-width: 200px;
            border-radius: 10px;
            cursor: pointer;
        }
        
        #inputArea {
            padding: 20px;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
        }
        
        #messageInput {
            flex: 1;
            padding: 12px;
            background: #252525;
            border: 1px solid #333;
            border-radius: 20px;
            color: white;
        }
        
        #inputArea button {
            padding: 12px 24px;
            background: #007aff;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Поиск пользователей */
        #searchResults {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #252525;
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
            z-index: 10;
        }
        
        .search-result-item {
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid #333;
        }
        
        .search-result-item:hover {
            background: #333;
        }

        .search-wrapper {
            position: relative;
        }
    </style>
</head>
<body>
    <!-- ЭКРАН АВТОРИЗАЦИИ -->
    <div id="authScreen">
        <div class="auth-box">
            <h2>🚀 SecureChat</h2>
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button id="loginTab" style="flex: 1;" onclick="switchTab('login')">Вход</button>
                <button id="regTab" class="secondary" style="flex: 1;" onclick="switchTab('register')">Регистрация</button>
            </div>
            
            <div id="loginForm">
                <input type="text" id="loginUsername" placeholder="Username">
                <input type="password" id="loginPassword" placeholder="Password">
                <button onclick="login()">Войти</button>
            </div>
            
            <div id="regForm" style="display: none;">
                <input type="text" id="regUsername" placeholder="Username">
                <input type="email" id="regEmail" placeholder="Email">
                <input type="password" id="regPassword" placeholder="Password">
                <button onclick="register()">Создать аккаунт</button>
            </div>
            
            <div class="error-msg" id="authError"></div>
        </div>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
    <div id="mainApp">
        <div id="sidebar">
            <div class="sidebar-header">
                <h3>💬 Чаты</h3>
                <span id="currentUserName"></span>
            </div>
            <div class="search-box">
                <div class="search-wrapper">
                    <input type="text" placeholder="🔍 Поиск пользователей..." oninput="searchUsers(this.value)">
                    <div id="searchResults"></div>
                </div>
            </div>
            <div id="chatsList">
                <div style="text-align: center; color: #666; padding: 40px 20px;">
                    Найдите пользователя чтобы начать чат
                </div>
            </div>
            <button onclick="logout()" style="margin: 10px; padding: 10px; background: #ff4444; color: white; border: none; border-radius: 10px; cursor: pointer;">
                🚪 Выйти
            </button>
        </div>
        
        <div id="chatArea">
            <div id="chatHeader">Выберите чат</div>
            <div id="messages">
                <div style="text-align: center; color: #666; padding: 100px 20px;">
                    <h2>💬 SecureChat</h2>
                    <p>Выберите чат или найдите пользователя</p>
                </div>
            </div>
            <div id="inputArea" style="display: none;">
                <input type="text" id="messageInput" placeholder="Сообщение..." onkeypress="if(event.key==='Enter')sendMessage()">
                <input type="file" accept="image/*" onchange="sendImage(this)" style="display: none;" id="imageInput">
                <button onclick="document.getElementById('imageInput').click()">📎</button>
                <button onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentUser = null;
        let currentChatId = null;

        // Переключение вкладок
        function switchTab(tab) {
            if (tab === 'login') {
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('regForm').style.display = 'none';
                document.getElementById('loginTab').className = '';
                document.getElementById('regTab').className = 'secondary';
            } else {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('regForm').style.display = 'block';
                document.getElementById('loginTab').className = 'secondary';
                document.getElementById('regTab').className = '';
            }
        }

        // Логин
        function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            
            if (!username || !password) {
                document.getElementById('authError').textContent = 'Заполните все поля';
                return;
            }
            
            socket.emit('login', { username, password });
        }

        // Регистрация
        function register() {
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            
            if (!username || !email || !password) {
                document.getElementById('authError').textContent = 'Заполните все поля';
                return;
            }
            
            socket.emit('register', { username, email, password });
        }

        // Обработчики событий
        socket.on('regSuccess', (msg) => {
            document.getElementById('authError').style.color = '#00ff00';
            document.getElementById('authError').textContent = msg;
            switchTab('login');
            setTimeout(() => {
                document.getElementById('authError').style.color = '#ff4444';
                document.getElementById('authError').textContent = '';
            }, 3000);
        });

        socket.on('regError', (msg) => {
            document.getElementById('authError').textContent = msg;
        });

        socket.on('authError', (msg) => {
            document.getElementById('authError').textContent = msg;
        });

        socket.on('authSuccess', (data) => {
            currentUser = data;
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('mainApp').style.display = 'flex';
            document.getElementById('currentUserName').textContent = data.username;
            
            // Загружаем существующие чаты
            if (data.chats && data.chats.length > 0) {
                renderChats(data.chats);
            }
        });

        // Поиск пользователей
        function searchUsers(query) {
            if (query.length < 2) {
                document.getElementById('searchResults').style.display = 'none';
                return;
            }
            socket.emit('searchUsers', query);
        }

        socket.on('searchResults', (users) => {
            const resultsDiv = document.getElementById('searchResults');
            
            if (users.length === 0) {
                resultsDiv.style.display = 'none';
                return;
            }
            
            resultsDiv.innerHTML = '';
            users.forEach(user => {
                const div = document.createElement('div');
                div.className = 'search-result-item';
                div.textContent = user.username;
                div.onclick = () => {
                    socket.emit('startChat', user);
                    resultsDiv.style.display = 'none';
                    document.getElementById('searchInput').value = '';
                };
                resultsDiv.appendChild(div);
            });
            
            resultsDiv.style.display = 'block';
        });

        // Отображение чатов
        function renderChats(chats) {
            const chatsList = document.getElementById('chatsList');
            chatsList.innerHTML = '';
            
            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = 'chat-item';
                div.innerHTML = `
                    <div class="chat-item-name">${chat.with}</div>
                    <div class="chat-item-last">${chat.lastMessage || 'Новый чат'}</div>
                `;
                div.onclick = () => openChat(chat);
                chatsList.appendChild(div);
            });
        }

        // Открыть чат
        function openChat(chat) {
            currentChatId = chat.id;
            document.getElementById('chatHeader').textContent = '💬 ' + chat.with;
            document.getElementById('inputArea').style.display = 'flex';
            document.getElementById('messages').innerHTML = '';
            
            socket.emit('getChatHistory', chat.id);
        }

        // Получить сообщения
        socket.on('chatMessages', (data) => {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.innerHTML = '';
            
            data.messages.forEach(msg => {
                addMessage(msg);
            });
            
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        // Новое сообщение
        socket.on('newMessage', (data) => {
            if (data.chatId === currentChatId) {
                addMessage(data.message);
                document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
            }
        });

        // Добавить сообщение в UI
        function addMessage(msg) {
            const messagesDiv = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message ' + (msg.from === currentUser.userId ? 'sent' : 'received');
            
            let content = '';
            if (msg.image) {
                content = `<img src="${msg.image}" onclick="window.open('${msg.image}')">`;
            } else {
                content = msg.text;
            }
            
            div.innerHTML = `
                <div class="message-bubble">
                    <div class="message-name">${msg.fromName}</div>
                    ${content}
                </div>
            `;
            
            messagesDiv.appendChild(div);
        }

        // Отправить сообщение
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (text && currentChatId) {
                socket.emit('sendMessage', {
                    chatId: currentChatId,
                    text: text
                });
                input.value = '';
            }
        }

        // Отправить изображение
        function sendImage(input) {
            const file = input.files[0];
            if (!file || !currentChatId) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                socket.emit('sendImage', {
                    chatId: currentChatId,
                    image: e.target.result
                });
            };
            reader.readAsDataURL(file);
            input.value = '';
        }

        // Выход
        function logout() {
            socket.emit('logout');
            currentUser = null;
            currentChatId = null;
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('authScreen').style.display = 'flex';
            document.getElementById('messages').innerHTML = '<div style="text-align: center; color: #666; padding: 100px 20px;"><h2>💬 SecureChat</h2><p>Выберите чат или найдите пользователя</p></div>';
            document.getElementById('inputArea').style.display = 'none';
        }

        // Создан новый чат
        socket.on('chatCreated', (chat) => {
            openChat(chat);
            // Добавляем в список
            const chatsList = document.getElementById('chatsList');
            const div = document.createElement('div');
            div.className = 'chat-item';
            div.innerHTML = `
                <div class="chat-item-name">${chat.with}</div>
                <div class="chat-item-last">Новый чат</div>
            `;
            div.onclick = () => openChat(chat);
            chatsList.insertBefore(div, chatsList.firstChild);
        });

        // Закрывать результаты поиска при клике вне
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-wrapper')) {
                document.getElementById('searchResults').style.display = 'none';
            }
        });
    </script>
</body>
</html>
