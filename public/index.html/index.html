<html>
<body style="background:black;color:lime;text-align:center;padding-top:100px;font-size:30px;">
    LOADING...
    <script src="/socket.io/socket.io.js"></script>
    <script>
        setTimeout(() => {
            try {
                const s = io();
                s.on('connect', () => document.body.innerHTML = 'OK ' + s.id);
                s.on('connect_error', e => document.body.innerHTML = 'ERR');
            } catch(e) {
                document.body.innerHTML = 'FAIL';
            }
        }, 1000);
    </script>
</body>
</html>
