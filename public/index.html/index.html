<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>TEST</title>
</head>
<body style="background: black; color: white; font-family: Arial; padding: 50px;">
    <h1>TEST PAGE</h1>
    <div id="status">Waiting...</div>
    <div id="error" style="color: red;"></div>
    
    <script>
        // Проверяем что JS работает
        document.getElementById('status').innerHTML = '✅ JavaScript работает<br>';
        
        // Проверяем socket.io
        try {
            var script = document.createElement('script');
            script.src = '/socket.io/socket.io.js';
            script.onload = function() {
                document.getElementById('status').innerHTML += '✅ Socket.io загружен<br>';
                
                if (typeof io !== 'undefined') {
                    document.getElementById('status').innerHTML += '✅ io определён<br>';
                    
                    const socket = io();
                    socket.on('connect', () => {
                        document.getElementById('status').innerHTML += '✅ Подключено к серверу!<br>';
                        document.getElementById('status').style.color = 'green';
                    });
                    
                    socket.on('welcome', (msg) => {
                        document.getElementById('status').innerHTML += '📩 ' + msg;
                    });
                    
                    socket.on('connect_error', (err) => {
                        document.getElementById('error').innerHTML += '❌ Ошибка подключения: ' + err.message;
                    });
                    
                } else {
                    document.getElementById('error').innerHTML = '❌ io не определён';
                }
            };
            script.onerror = function() {
                document.getElementById('error').innerHTML = '❌ Не удалось загрузить socket.io.js';
            };
            document.head.appendChild(script);
            
        } catch(e) {
            document.getElementById('error').innerHTML = '❌ Ошибка: ' + e.message;
        }
    </script>
</body>
</html>
