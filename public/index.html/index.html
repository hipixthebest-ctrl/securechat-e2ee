<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SecureChat</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #252525;
            --text: #ffffff;
            --text-secondary: #999;
            --accent: #0a84ff;
            --green: #30d158;
            --red: #ff453a;
            --border: #333;
            --shadow: 0 2px 12px rgba(0,0,0,0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* ======= САЙДБАР ======= */
        #sidebar {
            width: 360px;
            min-width: 360px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        #sidebar.hidden { display: none; }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sidebar-header h2 { font-size: 1.2rem; font-weight: 700; }
        .header-actions { display: flex; gap: 8px; }
        .header-actions button {
            background: var(--bg-tertiary);
            border: none;
            color: var(--text);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .search-box {
            padding: 12px 20px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border: none;
            border-radius: 12px;
            color: var(--text);
            font-size: 0.95rem;
        }
        .search-results {
            position: absolute;
            top: 60px;
            left: 20px;
            right: 20px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            box-shadow: var(--shadow);
        }
        .search-result-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            cursor: pointer;
            border-radius: 8px;
            margin: 4px;
        }
        .search-result-item:hover { background: var(--bg); }

        #chatsList {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 4px;
        }
        .chat-item:hover { background: var(--bg-tertiary); }
        .chat-item.active { background: var(--accent); }
        .chat-item-avatar {
            width: 52px;
            height: 52px;
            min-width: 52px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            overflow: hidden;
        }
        .chat-item-info { flex: 1; min-width: 0; }
        .chat-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .chat-item-name { font-weight: 600; font-size: 0.95rem; }
        .chat-item-time { font-size: 0.75rem; color: var(--text-secondary); }
        .chat-item-preview { font-size: 0.85rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
        .unread-badge {
            background: var(--accent);
            color: white;
            font-size: 0.7rem;
            padding: 2px 7px;
            border-radius: 10px;
            font-weight: 700;
        }

        /* ======= MAIN ======= */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        #chatHeader {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            display: none;
        }
        #chatAvatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            overflow: hidden;
        }
        #chatInfo { flex: 1; }
        #chatName { font-weight: 600; }
        #chatStatus { font-size: 0.8rem; }
        #closeChat {
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 8px;
            display: none;
        }

        #messagesContainer {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
        }
        .empty-chat {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }
        .empty-chat h2 { font-size: 1.5rem; margin-bottom: 8px; color: var(--text); }
        .date-separator {
            text-align: center;
            margin: 20px 0;
            color: var(--text-secondary);
            font-size: 0.8rem;
        }
        .message-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message-row.own { flex-direction: row-reverse; }
        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 600;
            flex-shrink: 0;
        }
        .message-bubble {
            max-width: 420px;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .message-row.own .message-bubble { background: var(--accent); color: white; border-bottom-right-radius: 4px; }
        .message-row.other .message-bubble { background: var(--bg-tertiary); border-bottom-left-radius: 4px; }
        .message-time {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 4px;
            padding: 0 4px;
        }
        .message-image { cursor: pointer; border-radius: 12px; max-width: 100%; }

        #inputContainer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            display: none;
        }
        #messageInput {
            flex: 1;
            padding: 14px 18px;
            background: var(--bg-tertiary);
            border: none;
            border-radius: 24px;
            color: var(--text);
            font-size: 1rem;
        }
        #inputContainer button {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: white;
            font-size: 1.3rem;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* ======= МОДАЛКИ ======= */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            display: none;
            backdrop-filter: blur(4px);
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--bg-secondary);
            border-radius: 24px;
            padding: 32px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .modal-content h2 { text-align: center; margin-bottom: 24px; }
        .tab-switcher {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            padding: 4px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: none;
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 10px;
        }
        .tab-btn.active { background: var(--accent); color: white; }
        .form-group { margin-bottom: 16px; }
        .form-group input {
            width: 100%;
            padding: 14px;
            background: var(--bg-tertiary);
            border: none;
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
        }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.8rem; color: var(--text-secondary); }
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }
        .error-msg {
            color: var(--red);
            font-size: 0.85rem;
            margin-top: 8px;
            text-align: center;
            display: none;
        }

        #settingsPage {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 90;
            padding: 24px;
            overflow-y: auto;
            display: none;
        }
        #settingsPage.active { display: block; }
        .settings-back {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 24px;
        }
        .setting-item {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 12px;
        }
        .toggle {
            width: 51px;
            height: 31px;
            background: #555;
            border-radius: 31px;
            cursor: pointer;
            position: relative;
            transition: background 0.3s;
            display: inline-block;
        }
        .toggle.active { background: var(--green); }
        .toggle::after {
            content: '';
            position: absolute;
            width: 27px;
            height: 27px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.3s;
        }
        .toggle.active::after { left: 22px; }

        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-tertiary);
            color: var(--text);
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 0.9rem;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        #toast.show { opacity: 1; }

        /* ======= МОБИЛКИ ======= */
        @media (max-width: 768px) {
            #sidebar { width: 100%; min-width: 100%; }
            #main { display: none; }
            #main.active { display: flex; }
            #closeChat { display: block; }
            .message-bubble { max-width: 260px; }
        }
    </style>
</head>
<body>
    <!-- ТОСТ -->
    <div id="toast"></div>

    <!-- АВТОРИЗАЦИЯ -->
    <div class="modal active" id="authModal">
        <div class="modal-content">
            <h2>🚀 SecureChat</h2>
            <div class="tab-switcher">
                <button class="tab-btn active" onclick="switchTab('login')">Вход</button>
                <button class="tab-btn" onclick="switchTab('register')">Регистрация</button>
            </div>
            <form id="loginForm" onsubmit="login(event)">
                <div class="form-group"><input type="text" id="loginUsername" placeholder="Имя пользователя" autocomplete="username"></div>
                <div class="form-group"><input type="password" id="loginPassword" placeholder="Пароль" autocomplete="current-password"></div>
                <button type="submit" class="submit-btn">Войти</button>
            </form>
            <form id="registerForm" onsubmit="register(event)" style="display:none">
                <div class="form-group"><input type="text" id="regUsername" placeholder="Имя пользователя"></div>
                <div class="form-group"><input type="email" id="regEmail" placeholder="Email"></div>
                <div class="form-group"><input type="password" id="regPassword" placeholder="Пароль (мин. 6 символов)"></div>
                <button type="submit" class="submit-btn">Создать аккаунт</button>
            </form>
            <div class="error-msg" id="authError"></div>
        </div>
    </div>

    <!-- 2FA -->
    <div class="modal" id="2FAModal">
        <div class="modal-content">
            <h2>🔐 2FA</h2>
            <p style="text-align:center;color:var(--text-secondary);margin-bottom:16px">Код отправлен на <strong id="2faEmail"></strong></p>
            <div class="form-group"><input type="text" id="2faCode" placeholder="6-значный код" maxlength="6" inputmode="numeric"></div>
            <button class="submit-btn" onclick="verify2FA()">Подтвердить</button>
            <div class="error-msg" id="2faError"></div>
        </div>
    </div>

    <!-- НАСТРОЙКИ -->
    <div id="settingsPage">
        <button class="settings-back" onclick="closeSettings()">← Назад</button>
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px">
            <div id="profileAvatar" style="width:64px;height:64px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.5rem;overflow:hidden"></div>
            <div>
                <h3 id="profileName" style="margin-bottom:4px"></h3>
                <span id="profileEmail" style="color:var(--text-secondary);font-size:0.9rem"></span>
            </div>
        </div>

        <div class="setting-item">
            <div style="display:flex;justify-content:space-between;align-items:center">
                <div><strong>Тёмная тема</strong></div>
                <div class="toggle active" id="themeToggle" onclick="toggleTheme()"></div>
            </div>
        </div>

        <div class="setting-item">
            <div style="display:flex;justify-content:space-between;align-items:center">
                <div><strong>Аватар</strong></div>
                <label style="color:var(--accent);cursor:pointer">Изменить<input type="file" accept="image/*" hidden onchange="uploadAvatar(this)"></label>
            </div>
        </div>

        <div class="setting-item">
            <div style="display:flex;justify-content:space-between;align-items:center">
                <div><strong>2FA</strong></div>
                <div style="display:flex;gap:8px">
                    <button class="submit-btn" style="padding:8px 16px;width:auto" onclick="enable2FA()">Вкл</button>
                    <button class="submit-btn" style="padding:8px 16px;width:auto;background:var(--red)" onclick="disable2FA()">Выкл</button>
                </div>
            </div>
        </div>

        <div class="setting-item">
            <div style="display:flex;justify-content:space-between;align-items:center">
                <div><strong>Уведомления</strong></div>
                <div class="toggle" id="notifToggle" onclick="requestNotificationPermission()"></div>
            </div>
        </div>

        <button class="submit-btn" style="background:var(--red);margin-top:16px" onclick="logout()">Выйти</button>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h2>💬 Сообщения</h2>
            <div class="header-actions">
                <button onclick="openSettings()" title="Настройки">⚙️</button>
            </div>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Найти пользователя..." oninput="searchUsers(this.value)">
            <div class="search-results" id="searchResults"></div>
        </div>
        <div id="chatsList">
            <div style="padding:40px 20px;text-align:center;color:var(--text-secondary);font-size:.9rem">🔒 Войдите в аккаунт</div>
        </div>
        <div style="padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;gap:12px">
            <div id="myAvatar" style="width:40px;height:40px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden"></div>
            <span id="myName" style="font-weight:600">Гость</span>
        </div>
    </div>

    <div id="main">
        <div id="chatHeader">
            <div id="chatAvatar"></div>
            <div id="chatInfo">
                <div id="chatName"></div>
                <div id="chatStatus"></div>
            </div>
            <button id="closeChat" onclick="closeChat()">✕</button>
        </div>
        <div id="messagesContainer">
            <div class="empty-chat"><h2>💬 SecureChat</h2><p>Безопасное общение</p></div>
        </div>
        <div id="inputContainer">
            <label style="cursor:pointer;font-size:1.5rem">📎<input type="file" accept="image/*" hidden onchange="sendImage(this)"></label>
            <input type="text" id="messageInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter')sendMessage()">
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        // ВСТАВЬ СЮДА ТОТ СКРИПТ, КОТОРЫЙ Я ДАЛ ПЕРВЫМ СООБЩЕНИЕМ (script.js)
    </script>
</body>
</html>
