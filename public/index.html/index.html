<!DOCTYPE html>
<html>
<head>
    <title>Test Chat</title>
</head>
<body>
    <h1>Chat Test Page</h1>
    <div id="status">Connecting...</div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Проверка загрузки socket.io
        if (typeof io === 'undefined') {
            document.getElementById('status').innerHTML = '❌ Socket.io not loaded!';
        } else {
            document.getElementById('status').innerHTML = '✅ Socket.io loaded!';
            
            const socket = io();
            
            socket.on('connect', () => {
                document.getElementById('status').innerHTML += '<br>✅ Connected to server!';
            });
            
            socket.on('welcome', (msg) => {
                document.getElementById('status').innerHTML += '<br>📩 ' + msg;
            });
            
            socket.on('connect_error', () => {
                document.getElementById('status').innerHTML += '<br>❌ Connection error';
            });
        }
    </script>
</body>
</html>
