services:
  - type: web
    name: whisper-messenger
    env: node
    region: oregon
    plan: free
    branch: main
    # Указываем корневую директорию
    rootDir: server
    # Путь для health check
    healthCheckPath: /api/health
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/whisper.db
    autoDeploy: true
    disk:
      name: whisper-data
      mountPath: /var/data
      sizeGB: 1
